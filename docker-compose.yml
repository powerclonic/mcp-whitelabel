services:
  server:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      reranker:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      EMBEDDING_BASE_URL: http://embeddings:8001
      RERANKER_URL: http://reranker:8002/rerank
      RERANKER_ENABLED: "true"

  # Lightweight runner for ingestion scripts (no reranker dependency).
  ingestor:
    build: .
    env_file:
      - .env.example
    depends_on:
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    environment:
      QDRANT_HOST: qdrant
      EMBEDDING_BASE_URL: http://embeddings:8001
      RERANKER_ENABLED: "false"

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    command: --model-id BAAI/bge-m3 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 600s

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    command: --model-id BAAI/bge-reranker-v2-m3 --port 8002
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 600s

  docs:
    image: squidfunk/mkdocs-material:latest
    command: serve --dev-addr 0.0.0.0:8080
    ports:
      - "8080:8080"
    volumes:
      - ./docs:/docs/docs:ro
      - ./mkdocs.yml:/docs/mkdocs.yml:ro

volumes:
  qdrant_storage:
